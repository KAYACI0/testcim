packages:
  - apps/*
  - packages/*
  - scripts

overrides:
  image-size: '>=2.0.3'
  uuid: '>=11.1.1'
  source-map-js: '>=1.2.2'

# Only these packages may run install scripts; pnpm blocks every other one.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: false
  esbuild: true
  sharp: true
  simple-git-hooks: true
  supabase: true
  unrs-resolver: true

# Generated by pnpm: packages newer than the default minimum release age.
minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/eslint-plugin-next@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - '@sentry/browser-utils@11.1.0'
  - '@sentry/browser@11.1.0'
  - '@sentry/bundler-plugins@11.1.0'
  - '@sentry/core@11.1.0'
  - '@sentry/feedback@11.1.0'
  - '@sentry/nextjs@11.1.0'
  - '@sentry/node@11.1.0'
  - '@sentry/opentelemetry@11.1.0'
  - '@sentry/react@11.1.0'
  - '@sentry/replay-canvas@11.1.0'
  - '@sentry/replay@11.1.0'
  - '@sentry/server-runtime-injection@11.1.0'
  - '@sentry/server-utils@11.1.0'
  - '@sentry/vercel-edge@11.1.0'
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - eslint-config-next@16.3.7
  - next@16.3.7
  - typescript-eslint@8.71.0
